# The zip a player gets, built on the two systems it is built for.
#
# Windows cannot be cross-compiled from Linux, so the `.exe` comes off a Windows
# runner or it does not exist. macOS is deliberately not built.
#
# Two ways in: `workflow_dispatch` for now, while this is alpha and private and
# a build is something we ask for by hand, and a `v*` tag when there is a
# version -- which additionally opens a **draft** release with both zips
# attached. Draft, because publishing is a decision and a tag is not.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the zip's name (default: git describe)"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Not `ubuntu-latest`: the binary links whatever glibc the runner has,
          # and an older runner is the one whose build also starts on an older
          # machine.
          - os: ubuntu-22.04
            system: linux
          - os: windows-latest
            system: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # `tools/build_exe.py` names the zip off `git describe`, which needs
          # the tags -- a shallow checkout has none of them.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Pyxel's extension links the system SDL2 rather than carrying its own, so
      # on Linux the library has to be installed for PyInstaller to find it and
      # pack it. Without this the build succeeds and the binary dies on
      # `ImportError: libSDL2-2.0.so.0` -- which is exactly what `--selftest`
      # caught the first time this workflow ran. The Windows wheel ships its own
      # DLL and needs nothing.
      - if: matrix.system == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-2.0-0

      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt

      # The suite before the build: a red artefact nobody can explain is worse
      # than no artefact.
      #
      # **On Linux only, and that is a statement about the suite rather than
      # about the build.** One of its rules does not hold on Windows: `art/` is
      # committed byte for byte and those bytes come out of a Linux zlib, so the
      # two `test_the_committed_bytes_are_the_ones_the_tool_writes` compare a
      # PNG against a differently-compressed picture of the same pixels and
      # fail. That is a fact about the runner, not about the build. What has to
      # be true of a Windows build -- that the bundle is whole -- is asked of the
      # binary itself two steps down.
      #
      # (The other thing the first Windows run found was a real bug and is
      # fixed: `os.path.relpath` raises across two drive letters, and the editor
      # printed one. See `game/paths.short`.)
      - if: matrix.system == 'linux'
        run: python -m pytest tests/ -q -n auto

      # Builds, then runs the binary's own `--selftest` -- headless, because
      # there is no display on a runner. That step is what proves the bundle
      # carries every tile and every map, and it is inside the script.
      - name: Build
        run: python tools/build_exe.py ${{ inputs.version && format('--version {0}', inputs.version) || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: bmx-80-${{ matrix.system }}
          path: dist/*.zip
          if-no-files-found: error
          # A private repo gets 500 MB of artifact storage on the free plan and
          # each run leaves ~48 MB of it. Ninety days of hand-fired builds would
          # fill that; a fortnight is longer than anybody waits to download one.
          retention-days: 14

  draft:
    # Only for a tag. A hand-fired build is for looking at, not for releasing.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: zips
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: zips/*.zip
