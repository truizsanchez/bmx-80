[mypy]
files = game, maps, tools, main.py
# Pyxel's own editor toolkit, vendored. Its stated contract is diffability
# against upstream, so it is not ours to annotate or to correct -- and it is
# genuinely `Any` to a checker anyway: `Widget._bind_var_property` installs every
# `*_var` with `setattr(self.__class__, name, property(...))` at first
# instantiation, so `is_enabled_var`, `value_var` and `is_checked_var` exist on
# no class a reader can see. Excluded whole rather than silenced per error, which
# would have hidden real typos on our own objects too.
exclude = ^tools/editor/widgets/

# `tools/` has no `__init__.py` while `tools/editor/` does, so left alone mypy
# names the module `editor.history` and cannot resolve
# `from tools.editor.history import History`. These two lines are what make the
# runtime's `sys.path.insert` idiom resolve
# the same way here. Without them the checker is wrong about the whole package
# and says so in imports rather than in types.
mypy_path = .
explicit_package_bases = True

# The floor, and the whole of it: check the bodies of functions that carry no
# annotations. No annotation is required anywhere by this, and Pyxel ships
# `py.typed` and a real `__init__.pyi`, so the calls at the edges -- which is
# where rule 1 says the window lives -- are checked against actual signatures.
check_untyped_defs = True
warn_unused_configs = True

# The strict allowlist, and it is a list because it grows: annotate a module and
# add it here in the same commit, working **from the bottom of the import graph
# up**. A strict file that imports a loose one spends its time fighting
# `disallow_untyped_calls`, so the order is not a preference. `strict` itself is
# a global-only flag, which is why the flags are spelled out.
#
# `constants.py` is vacuous -- numbers and no functions at all -- and on the list
# for what it does tomorrow: a function added there arrives typed or not at all.
#
# One section rather than a copy of the same seven lines per module: what the
# file has to say is which modules are strict, and identical blocks bury that in
# repetition -- and the next one would be pasted with one flag missing.
[mypy-game.constants,game.engine,game.engine.original,game.engine.rules,game.engine.speed,game.engine.vector,game.engine.terrain,game.engine.probes,game.engine.flight,game.engine.bike,game.engine.items,game.engine.camera,game.engine.background,game.engine.rival,game.engine.run,game.rom,game.rom.cartridge,game.rom.course,game.rom.graphics,game.rom.sound,game.rom.apu,game.rom.mixer,game.rom.panel,game.rom.screen,game.sfx,game.render.audio,game.cadence,game.mode,game.trace,game.paths,game.course,game.records,game.render.style,game.menu,game.front,game.render.assets,game.render.lettering,game.render.menu_draw,game.render.rom_art,game.render.ride_draw,game.render.front_draw,game.render.headless,game.render.palette,main,tools.editor.history,tools.editor.palette,tools.editor.document,tools.editor.map_file,tools.editor.view,tools.editor.ui,tools.menu_shot,tools.art_sheet,tools.build_exe,tools.label_vocab,tools.tile_gen,tools.sprite_gen,tools.art_check,tools.pixels,tools.rom_shot,tools.solve,tools.vocab_from_rom,maps,maps.read]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True
disallow_any_generics = True
no_implicit_optional = True
warn_return_any = True
strict_equality = True

# ...and excluded from being *followed* too, or the editor importing it brings
# every one of those runtime properties back as an error.
[mypy-tools.editor.widgets.*]
follow_imports = skip
